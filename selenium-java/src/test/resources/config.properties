# Base URLs for the application under test.
baseURL=http://localhost:3000
devBaseURL=http://localhost:5173

# API endpoints
healthEndpoint=/health
uploadEndpoint=/api/upload

# Server startup
autostart.servers=true
server.start.command=npm run server
server.start.url=http://localhost:3000/health
dev.start.command=npm run dev
dev.start.url=http://localhost:5173
server.timeout.seconds=60

# Browser settings
headless=true
browser=chrome
